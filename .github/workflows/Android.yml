name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js for web and Capacitor dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Install NPM dependencies & build static web assets
      - name: Install & Build Web App
        run: |
          npm ci
          npm run build

      # 4. Set up Java JDK required for Android Gradle builds
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Sync web build files into the native Android folder
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 6. Grant execute permissions to Gradle wrapper script
      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      # 7. Build the debug APK using Gradle
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 8. Upload generated APK as a downloadable GitHub artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
